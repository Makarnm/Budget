function categorize(desc) {
  const l = (desc||"").toLowerCase();
  for (const [cat,kws] of Object.entries(CATEGORIES))
    if (kws.some(k=>l.includes(k))) return cat;
  return "🔧 Other";
}

// ─── Parse Raiffeisen Serbia PDF text (extracted via pdf.js) ─────────────────
// Structure after pdf.js extraction (grouped by Y position):
// Each visual line becomes one text line.
// Transaction rows: DATE1  DATE2  [CARD]  DESC...  then on next lines: amounts
// Amounts pattern: "0.00 " (iznos_ref) then "X,XXX.XX RSD" (iznos_orig) then ISPLATA  UPLATA  STANJE
// OR for IPS transfers: "0.00 " then ISPLATA  UPLATA  STANJE  (no RSD label)

function parseRaiffeisenPDF(rawText) {
  const dateRe = /^\d{2}\.\d{2}\.\d{4}$/;
  const numRe  = /^\d[\d,]*\.\d{2}$/;
  const cardRe = /^\d{3,5}$/;

  const SKIP = [
    'Datum prijema','Datum transakcije','izvršenja','ref. valuti',
    'Iznos u','Iznos u orig','Isplata','Uplata','Stanje','Broj kartice','Opis promene',
    'Za devizne','Za dinarske','važi na dan','Poštovani','prodajni','kupovni kurs',
    'NIKITA MAKAROV','BULEVAR HEROJA','REON','Raiffeisen banka','Đorđa Stanojevića',
    '11070 Beograd','Tel:','Fax:','Internet:','http','Datum: ','Izvod broj','Valuta:',
    'Strana:','Izvod po tekućem','Prethodno stanje','STANJE','Nerealizovani',
    '11 3202','11073 BEOGRAD','265000000706105590','PAK:',
  ];

  function skipToken(t) {
    if (!t) return true;
    if (SKIP.some(p => t.includes(p))) return true;
    if (['RSD','Kurs:','Datum','valuti'].includes(t)) return true;
    if (/^Od \d/.test(t)) return true;
    if (/^\d{5,}$/.test(t)) return true;          // long account numbers
    if (/^\d\/\d$/.test(t)) return true;           // page "1/3"
    if (/^419[,.]983/.test(t)) return true;        // opening balance
    return false;
  }

  function parseNum(s) {
    try { return parseFloat(s.replace(/,/g,'')) || 0; } catch { return 0; }
  }

  function isExpenseDesc(desc) {
    const l = desc.toLowerCase();
    return l.includes('zaduženje') || l.includes('zaduzenje') ||
           l.includes('gotovinska isplata') || l.includes('smart atm') ||
           l.includes('naknada za vodenje');
  }

  // Tokenize
  const tokens = rawText.split(/\n+/).map(t=>t.trim()).filter(t=>t && !skipToken(t));

  const txs = [];
  let i = 0;

  while (i < tokens.length) {
    // Find transaction start: two consecutive dates
    if (!dateRe.test(tokens[i])) { i++; continue; }
    if (i+1 >= tokens.length || !dateRe.test(tokens[i+1])) { i++; continue; }

    const date1 = tokens[i];
    i += 2; // skip date2

    // Optional card number
    if (i < tokens.length && cardRe.test(tokens[i])) i++;

    // Collect description tokens until 3 consecutive numbers appear
    const descParts = [];
    while (i < tokens.length) {
      const tok = tokens[i];
      if (dateRe.test(tok)) break;
      // Check if this and next 2 are all numbers → amounts block
      if (numRe.test(tok) &&
          i+1 < tokens.length && numRe.test(tokens[i+1]) &&
          i+2 < tokens.length && numRe.test(tokens[i+2])) break;
      descParts.push(tok);
      i++;
    }

    // Consume up to 3 numbers: isplata, uplata, stanje
    const nums = [];
    while (i < tokens.length && nums.length < 3) {
      const tok = tokens[i];
      if (numRe.test(tok)) { nums.push(parseNum(tok)); i++; }
      else if (dateRe.test(tok)) break;
      else { i++; }
    }
    if (nums.length < 2) continue;

    const isplata = nums[0], uplata = nums[1];

    // Clean description
    let desc = descParts.join(' ')
      .replace(/\d[\d,]*\.\d{2}\s*RSD\b/g, '')
      .replace(/\b0\.00\b/g, '')
      .replace(/^Rn:\s*/, '')
      .replace(/\s+/g, ' ')
      .trim();
    if (!desc || desc.length < 3) continue;

    // Determine amount direction
    let amount = 0;
    if (isplata > 0 && uplata === 0) {
      amount = -isplata;
    } else if (uplata > 0 && isplata === 0) {
      amount = isExpenseDesc(desc) ? -uplata : uplata;
    } else if (isplata > 0 && uplata > 0) {
      amount = isExpenseDesc(desc) ? -isplata : uplata;
    }
    if (amount === 0) continue;

    txs.push({
      id: Math.random().toString(36).slice(2),
      date: date1,
      description: desc,
      amount,
      currency: "RSD",
      category: categorize(desc),
      type: amount < 0 ? "expense" : "income",
    });
  }
  return txs;
}

// ─── CSV fallback ────────────────────────────────────────────────────────────
function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/).filter(l=>l.trim());
  const txs = [];
  for (const line of lines) {
    const parts = line.split(/[;,\t]/).map(s=>s.trim().replace(/^["']|["']$/g,""));
    if (parts.length < 3) continue;
    let date=null, desc="", amount=0;
    for (const p of parts) {
      if (!date && /^\d{1,2}\.\d{1,2}\.\d{4}$/.test(p)) date=p;
      else if (!date && /^\d{4}-\d{2}-\d{2}/.test(p)) date=p.slice(0,10).split("-").reverse().join(".");
    }
    desc = parts.find((p,i)=>i>0&&p.length>2&&!/^[\d.,\s\-]+$/.test(p)&&!/^\d{1,2}\.\d{1,2}\.\d{4}$/.test(p)) || "";
    const numParts = parts.map(p=>parseFloat(p.replace(/\s/g,"").replace(",","."))).filter(v=>!isNaN(v)&&v!==0);
    if (parts.length>=4){
      const d=parseFloat((parts[parts.length-4]||"0").replace(/\s/g,"").replace(",","."))||0;
      const c=parseFloat((parts[parts.length-3]||"0").replace(/\s/g,"").replace(",","."))||0;
      if(d>0)amount=-d; else if(c>0)amount=c;
    }
    if(!amount&&numParts.length)amount=numParts[numParts.length-1];
    if(desc&&amount!==0)txs.push({id:Math.random().toString(36).slice(2),date:date||"",description:desc,amount,currency:"RSD",category:categorize(desc),type:amount<0?"expense":"income"});
  }
  return txs;
}

// ─── Storage ─────────────────────────────────────────────────────────────────
const STORAGE_KEY = "rb_budget_v2";
const MORTGAGE_KEY = "rb_mortgage_v2";

function loadTxs() {
  try { const r=localStorage.getItem(STORAGE_KEY); return r?JSON.parse(r):[]; } catch { return []; }
}
function saveTxs(txs) {
  try { localStorage.setItem(STORAGE_KEY,JSON.stringify(txs)); } catch {}
}
function loadMortgage() {
  try { const r=localStorage.getItem(MORTGAGE_KEY); return r?JSON.parse(r):{enabled:false,balance:50000,rate:4.5,payment:600,extraMonthly:0,currency:"EUR",notes:""}; }
  catch { return {enabled:false,balance:50000,rate:4.5,payment:600,extraMonthly:0,currency:"EUR",notes:""}; }
}
function saveMortgage(m) { try { localStorage.setItem(MORTGAGE_KEY,JSON.stringify(m)); } catch {} }

// ─── AI context ───────────────────────────────────────────────────────────────
function buildContext(transactions, mortgage) {
  let ctx = "";
  if (transactions.length) {
    const byCat={}, byMonth={};
    let totalIn=0, totalEx=0;
    for (const t of transactions) {
      byCat[t.category]=(byCat[t.category]||0)+t.amount;
      const p=t.date.split(".");
      const m=p.length===3?`${p[2]}-${p[1]}`:t.date.slice(0,7);
      if(!byMonth[m])byMonth[m]={income:0,expense:0};
      if(t.type==="income"){byMonth[m].income+=t.amount;totalIn+=t.amount;}
      else{byMonth[m].expense+=Math.abs(t.amount);totalEx+=Math.abs(t.amount);}
    }
    ctx+=`TRANSACTIONS (${transactions.length} total):\nTotal income: ${totalIn.toFixed(0)} RSD\nTotal expenses: ${totalEx.toFixed(0)} RSD\nBalance: ${(totalIn-totalEx).toFixed(0)} RSD\n\nBY CATEGORY:\n`;
    ctx+=Object.entries(byCat).sort((a,b)=>a[1]-b[1]).map(([c,v])=>`${c}: ${v.toFixed(0)} RSD`).join("\n");
    ctx+="\n\nBY MONTH:\n"+Object.entries(byMonth).sort().map(([m,v])=>`${m}: income ${v.income.toFixed(0)}, expenses ${v.expense.toFixed(0)}`).join("\n")+"\n\n";
  } else { ctx+="No transaction data loaded.\n\n"; }
  if (mortgage.enabled) {
    const r=mortgage.rate/100/12, months=calcSchedule(mortgage.balance,mortgage.rate,mortgage.payment).length;
    const totalInt=calcSchedule(mortgage.balance,mortgage.rate,mortgage.payment).reduce((s,r)=>s+r.interest,0);
    ctx+=`MORTGAGE:\nBalance: ${mortgage.balance.toLocaleString()} ${mortgage.currency}\nRate: ${mortgage.rate}% annual\nPayment: ${mortgage.payment.toLocaleString()} ${mortgage.currency}/month\nMonths remaining: ~${months} (${(months/12).toFixed(1)} years)\nTotal interest: ~${totalInt.toFixed(0)} ${mortgage.currency}\n`;
  }
  return ctx;
}

function calcSchedule(balance,annualRate,payment,extraMonthly=0,extraOneTime=0) {
  const rate=annualRate/100/12;
  const rows=[]; let bal=balance-extraOneTime, month=0;
  while(bal>0.01&&month<600){
    month++;
    const interest=bal*rate, principal=(payment+extraMonthly)-interest;
    if(principal<=0)break;
    bal=Math.max(0,bal-principal);
    rows.push({month,interest:+interest.toFixed(2),principal:+principal.toFixed(2),balance:+bal.toFixed(2)});
    if(bal<0.01)break;
  }
  return rows;
}

const CAT_COLORS=["#5B8AF5","#3ECFA0","#F5B942","#F26B5E","#A78BFA","#34D399","#FB923C","#60A5FA","#F472B6","#4ADE80","#FACC15","#E879F9"];
function fmt(n,dec=0){return Number(n).toLocaleString("sr-RS",{maximumFractionDigits:dec});}

function BarChart({data}){
  const max=Math.max(...data.map(d=>Math.abs(d.value)),1);
  return <div style={{display:"flex",flexDirection:"column",gap:6}}>
    {data.map((d,i)=>(
      <div key={d.label} style={{display:"flex",alignItems:"center",gap:8}}>
        <div style={{width:130,fontSize:11,color:C.muted,textAlign:"right",flexShrink:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{d.label}</div>
        <div style={{flex:1,height:18,background:C.border,borderRadius:3,overflow:"hidden"}}>
          <div style={{height:"100%",borderRadius:3,width:`${(Math.abs(d.value)/max)*100}%`,background:CAT_COLORS[i%CAT_COLORS.length],transition:"width 0.6s"}}/>
        </div>
        <div style={{width:80,fontSize:11,color:C.text,textAlign:"right",flexShrink:0}}>{fmt(d.value)}</div>
      </div>
    ))}
  </div>;
}

function TxRow({t}){
  const isIn=t.type==="income";
  return <div style={{display:"flex",alignItems:"center",padding:"8px 12px",borderBottom:`1px solid ${C.border}`,gap:10}}>
    <div style={{fontSize:18,width:28,textAlign:"center",flexShrink:0}}>{t.category.split(" ")[0]}</div>
    <div style={{flex:1,minWidth:0}}>
      <div style={{fontSize:13,color:C.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{t.description}</div>
      <div style={{fontSize:11,color:C.muted}}>{t.date} · {t.category.split(" ").slice(1).join(" ")}</div>
    </div>
    <div style={{fontSize:13,fontWeight:600,color:isIn?C.green:C.red,flexShrink:0}}>
      {isIn?"+":""}{fmt(t.amount)} RSD
    </div>
  </div>;
}

function Message({msg}){
  const isUser=msg.role==="user";
  return <div style={{display:"flex",justifyContent:isUser?"flex-end":"flex-start",marginBottom:12}}>
    {!isUser&&<div style={{width:28,height:28,borderRadius:"50%",background:C.accentSoft,border:`1.5px solid ${C.accent}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,flexShrink:0,marginRight:8,marginTop:2}}>💡</div>}
    <div style={{maxWidth:"82%",padding:"10px 14px",borderRadius:isUser?"16px 16px 4px 16px":"16px 16px 16px 4px",background:isUser?C.accentSoft:C.card,border:`1px solid ${isUser?C.accent:C.border}`,fontSize:13.5,color:C.text,lineHeight:1.6,whiteSpace:"pre-wrap"}}>
      {msg.content}
    </div>
  </div>;
}

function Field({label,value,onChange,type="number",placeholder="",suffix="",style={}}){
  return <div style={{display:"flex",flexDirection:"column",gap:4,...style}}>
    <label style={{fontSize:11,color:C.muted,textTransform:"uppercase",letterSpacing:0.5}}>{label}</label>
    <div style={{display:"flex",alignItems:"center",background:C.bg,border:`1px solid ${C.border}`,borderRadius:8,overflow:"hidden"}}>
      <input type={type} value={value} onChange={onChange} placeholder={placeholder}
        style={{flex:1,background:"none",border:"none",padding:"9px 12px",color:C.text,fontSize:13,outline:"none",width:"100%"}}/>
      {suffix&&<span style={{padding:"0 10px",color:C.muted,fontSize:12,flexShrink:0}}>{suffix}</span>}
    </div>
  </div>;
}

function MortgagePanel({mortgage,setMortgage}){
  const [extraOne,setExtraOne]=useState(0);
  const schedule=calcSchedule(mortgage.balance,mortgage.rate,mortgage.payment,mortgage.extraMonthly,extraOne);
  const scheduleBase=calcSchedule(mortgage.balance,mortgage.rate,mortgage.payment,0,0);
  const totalInt=schedule.reduce((s,r)=>s+r.interest,0);
  const savedMonths=scheduleBase.length-schedule.length;
  const savedInterest=scheduleBase.reduce((s,r)=>s+r.interest,0)-totalInt;
  const payoffDate=(()=>{const d=new Date();d.setMonth(d.getMonth()+schedule.length);return d.toLocaleDateString("en-GB",{month:"long",year:"numeric"});})();
  const chartPoints=[];
  for(let i=0;i<schedule.length;i+=Math.max(1,Math.floor(schedule.length/24)))chartPoints.push({x:i,y:schedule[i].balance});
  chartPoints.push({x:schedule.length,y:0});
  const chartW=280,chartH=80;
  const pts=chartPoints.map(p=>`${(p.x/schedule.length)*chartW},${chartH-(p.y/mortgage.balance)*chartH}`).join(" ");
  return <div style={{display:"flex",flexDirection:"column",gap:16}}>
    <div style={{background:C.card,borderRadius:12,padding:16,border:`1px solid ${C.border}`}}>
      <div style={{fontSize:13,fontWeight:600,marginBottom:14}}>⚙️ Mortgage parameters</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
        <Field label="Remaining balance" value={mortgage.balance} onChange={e=>setMortgage(m=>({...m,balance:+e.target.value}))} suffix={mortgage.currency}/>
        <Field label="Annual rate" value={mortgage.rate} onChange={e=>setMortgage(m=>({...m,rate:+e.target.value}))} suffix="%"/>
        <Field label="Monthly payment" value={mortgage.payment} onChange={e=>setMortgage(m=>({...m,payment:+e.target.value}))} suffix={mortgage.currency}/>
        <div style={{display:"flex",flexDirection:"column",gap:4}}>
          <label style={{fontSize:11,color:C.muted,textTransform:"uppercase",letterSpacing:0.5}}>Currency</label>
          <select value={mortgage.currency} onChange={e=>setMortgage(m=>({...m,currency:e.target.value}))}
            style={{background:C.bg,border:`1px solid ${C.border}`,borderRadius:8,padding:"9px 12px",color:C.text,fontSize:13,outline:"none"}}>
            {["EUR","RSD","CHF","USD"].map(c=><option key={c}>{c}</option>)}
          </select>
        </div>
        <Field label="Extra / month" value={mortgage.extraMonthly} onChange={e=>setMortgage(m=>({...m,extraMonthly:+e.target.value}))} suffix={mortgage.currency}/>
        <Field label="One-time extra payment" value={extraOne} onChange={e=>setExtraOne(+e.target.value)} suffix={mortgage.currency}/>
      </div>
      <div style={{marginTop:12}}>
        <Field label="Notes" value={mortgage.notes} onChange={e=>setMortgage(m=>({...m,notes:e.target.value}))} type="text" placeholder="Raiffeisen, fixed rate..."/>
      </div>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:12}}>
      {[
        {label:"Payoff date",value:payoffDate,color:C.accent},
        {label:"Months remaining",value:`${schedule.length} mo.`,color:C.text},
        {label:"Total interest",value:`${fmt(totalInt)} ${mortgage.currency}`,color:C.red},
        {label:"Savings (early repay)",value:savedMonths>0?`${savedMonths} mo. / ${fmt(savedInterest)} ${mortgage.currency}`:"No extra payments",color:C.green},
      ].map(k=>(
        <div key={k.label} style={{background:C.card,borderRadius:12,padding:14,border:`1px solid ${C.border}`}}>
          <div style={{fontSize:11,color:C.muted,marginBottom:6,textTransform:"uppercase",letterSpacing:0.4}}>{k.label}</div>
          <div style={{fontSize:14,fontWeight:700,color:k.color}}>{k.value}</div>
        </div>
      ))}
    </div>
    <div style={{background:C.card,borderRadius:12,padding:16,border:`1px solid ${C.border}`}}>
      <div style={{fontSize:13,fontWeight:600,marginBottom:12}}>📉 Balance over time</div>
      <svg width="100%" viewBox={`0 0 ${chartW} ${chartH+10}`} style={{overflow:"visible"}}>
        <defs><linearGradient id="grad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={C.accent} stopOpacity="0.3"/><stop offset="100%" stopColor={C.accent} stopOpacity="0"/></linearGradient></defs>
        <polygon points={`0,${chartH} ${pts} ${chartW},${chartH}`} fill="url(#grad)"/>
        <polyline points={pts} fill="none" stroke={C.accent} strokeWidth="2"/>
      </svg>
      <div style={{display:"flex",justifyContent:"space-between",fontSize:11,color:C.muted,marginTop:4}}>
        <span>Now: {fmt(mortgage.balance)} {mortgage.currency}</span>
        <span>→ {payoffDate}</span>
      </div>
    </div>
    <div style={{background:C.card,borderRadius:12,border:`1px solid ${C.border}`,overflow:"hidden"}}>
      <div style={{padding:"12px 16px",borderBottom:`1px solid ${C.border}`,fontSize:13,fontWeight:600}}>Amortisation schedule (first 24 months)</div>
      <div style={{overflowX:"auto"}}>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
          <thead><tr style={{background:C.bg}}>{["Mo.","Payment","Interest","Principal","Balance"].map(h=><th key={h} style={{padding:"8px 12px",color:C.muted,textAlign:"right",fontWeight:500,whiteSpace:"nowrap"}}>{h}</th>)}</tr></thead>
          <tbody>
            {schedule.slice(0,24).map((r,i)=>(
              <tr key={r.month} style={{borderTop:`1px solid ${C.border}`,background:i%2===0?"transparent":C.surface}}>
                <td style={{padding:"7px 12px",color:C.muted,textAlign:"right"}}>{r.month}</td>
                <td style={{padding:"7px 12px",color:C.text,textAlign:"right"}}>{fmt(mortgage.payment+mortgage.extraMonthly)}</td>
                <td style={{padding:"7px 12px",color:C.red,textAlign:"right"}}>{fmt(r.interest)}</td>
                <td style={{padding:"7px 12px",color:C.green,textAlign:"right"}}>{fmt(r.principal)}</td>
                <td style={{padding:"7px 12px",color:C.text,textAlign:"right",fontWeight:500}}>{fmt(r.balance)}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      {schedule.length>24&&<div style={{padding:"10px 16px",fontSize:12,color:C.muted,borderTop:`1px solid ${C.border}`}}>... {schedule.length-24} more payments remaining</div>}
    </div>
  </div>;
}

// ═══════════════════════════════════════════════════════════════════════════
function App() {
  const [tab,setTab]=useState("upload");
  const [transactions,setTransactions]=useState(()=>loadTxs());
  const [messages,setMessages]=useState([{role:"assistant",content:"Hello! 👋 I'm your personal finance assistant.\n\nUpload a Raiffeisen Serbia PDF statement and I'll categorise your transactions, forecast spending, and help plan your savings and mortgage payoff."}]);
  const [chatInput,setChatInput]=useState("");
  const [loading,setLoading]=useState(false);
  const [pdfLoading,setPdfLoading]=useState(false);
  const [pasteText,setPasteText]=useState("");
  const [txFilter,setTxFilter]=useState("all");
  const [mortgage,setMortgage]=useState(()=>loadMortgage());
  const [parseLog,setParseLog]=useState("");
  const [showClearConfirm,setShowClearConfirm]=useState(false);
  const chatEndRef=useRef(null);
  const fileRef=useRef(null);

  useEffect(()=>{ saveTxs(transactions); },[transactions]);
  useEffect(()=>{ saveMortgage(mortgage); },[mortgage]);
  useEffect(()=>{ chatEndRef.current?.scrollIntoView({behavior:"smooth"}); },[messages]);
  useEffect(()=>{ if(transactions.length>0) setTab("overview"); },[]);

  const loadPdfJs=useCallback(()=>new Promise((resolve,reject)=>{
    if(window.pdfjsLib){resolve(window.pdfjsLib);return;}
    const s=document.createElement("script");
    s.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
    s.onload=()=>{window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";resolve(window.pdfjsLib);};
    s.onerror=reject;
    document.head.appendChild(s);
  }),[]);

  const extractPdfText=useCallback(async(file)=>{
    const pdfjsLib=await loadPdfJs();
    const buf=await file.arrayBuffer();
    const pdf=await pdfjsLib.getDocument({data:buf}).promise;
    let fullText="";
    for(let p=1;p<=pdf.numPages;p++){
      const page=await pdf.getPage(p);
      const content=await page.getTextContent();
      const byY={};
      for(const item of content.items){
        const y=Math.round(item.transform[5]);
        if(!byY[y])byY[y]=[];
        byY[y].push({x:item.transform[4],str:item.str});
      }
      const ys=Object.keys(byY).map(Number).sort((a,b)=>b-a);
      for(const y of ys){
        const line=byY[y].sort((a,b)=>a.x-b.x).map(i=>i.str).join(" ").trim();
        if(line) fullText+=line+"\n";
      }
      fullText+="\n";
    }
    return fullText;
  },[loadPdfJs]);

  const processText=useCallback((text,isPdf=false)=>{
    const parsed=isPdf?parseRaiffeisenPDF(text):parseCSV(text);
    if(!parsed.length){
      setParseLog("⚠️ Could not recognise any transactions. Check the file format.");
      return;
    }
    setTransactions(prev=>{
      const existing=new Set(prev.map(t=>`${t.date}|${t.description}|${t.amount}`));
      const newTxs=parsed.filter(t=>!existing.has(`${t.date}|${t.description}|${t.amount}`));
      const dupes=parsed.length-newTxs.length;
      const merged=[...prev,...newTxs];
      setParseLog(`✅ Added ${newTxs.length} transactions${dupes>0?` (${dupes} duplicates skipped)`:""} · Total: ${merged.length}`);
      return merged;
    });
    setTab("overview");
  },[]);

  const handleFile=useCallback(async(file)=>{
    const isPdf=file.name.toLowerCase().endsWith(".pdf");
    if(isPdf){
      setPdfLoading(true);
      setParseLog("📄 Reading PDF...");
      try{
        const text=await extractPdfText(file);
        processText(text,true);
      }catch(e){
        setParseLog("⚠️ PDF error: "+e.message);
      }finally{setPdfLoading(false);}
    }else{
      const r=new FileReader();
      r.onload=e=>processText(e.target.result,false);
      r.readAsText(file,"UTF-8");
    }
  },[extractPdfText,processText]);

  const clearAll=()=>{
    setTransactions([]);
    localStorage.removeItem(STORAGE_KEY);
    localStorage.removeItem(MORTGAGE_KEY);
    setParseLog("🗑️ All data cleared");
    setShowClearConfirm(false);
    setTab("upload");
  };

  const sendMessage=async()=>{
    if(!chatInput.trim()||loading)return;
    const userMsg={role:"user",content:chatInput.trim()};
    setChatInput("");
    setMessages(prev=>[...prev,userMsg]);
    setLoading(true);
    const ctx=buildContext(transactions,mortgage);
    const sys=`You are an expert personal finance advisor for a user living in Belgrade, Serbia. Reply in Russian language.

User financial data:
${ctx}

Be specific, use actual numbers. Keep answers concise with emoji. Currency is RSD (Serbian dinar), mortgage may be in EUR.`;
    const history=messages.slice(-10).map(m=>({role:m.role,content:m.content}));
    history.push(userMsg);
    try{
      const res=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,system:sys,messages:history}),
      });
      const data=await res.json();
      const reply=data.content?.map(b=>b.text||"").join("")||"Error getting response.";
      setMessages(prev=>[...prev,{role:"assistant",content:reply}]);
    }catch{
      setMessages(prev=>[...prev,{role:"assistant",content:"⚠️ API error. Check your connection."}]);
    }finally{setLoading(false);}
  };

  const income=transactions.filter(t=>t.type==="income").reduce((s,t)=>s+t.amount,0);
  const expense=transactions.filter(t=>t.type==="expense").reduce((s,t)=>s+Math.abs(t.amount),0);
  const balance=income-expense;
  const expByCat={};
  for(const t of transactions.filter(t=>t.type==="expense"))expByCat[t.category]=(expByCat[t.category]||0)+Math.abs(t.amount);
  const catData=Object.entries(expByCat).sort((a,b)=>b[1]-a[1]).map(([label,value])=>({label,value}));
  const filtered=txFilter==="all"?transactions:transactions.filter(t=>t.type===txFilter);
  const dates=transactions.map(t=>t.date).filter(Boolean).sort();
  const dateRange=dates.length>1?`${dates[0]} — ${dates[dates.length-1]}`:"";

  const TABS=[
    {id:"upload",label:"+ Add"},
    {id:"overview",label:"Overview",disabled:!transactions.length},
    {id:"mortgage",label:"Mortgage"},
    {id:"chat",label:"AI Chat"},
  ];

  return <div style={{background:C.bg,minHeight:"100vh",fontFamily:"'Inter','SF Pro Display',system-ui,sans-serif",color:C.text}}>
    <div style={{background:C.surface,borderBottom:`1px solid ${C.border}`,padding:"14px 20px",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:10}}>
      <div style={{display:"flex",alignItems:"center",gap:10}}>
        <div style={{width:32,height:32,borderRadius:8,background:`linear-gradient(135deg,${C.accent},#8B5CF6)`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:17}}>💎</div>
        <div>
          <div style={{fontSize:15,fontWeight:700,letterSpacing:-0.3}}>Family Budget AI</div>
          <div style={{fontSize:10,color:C.muted,letterSpacing:0.4,textTransform:"uppercase"}}>
            {transactions.length>0?`${transactions.length} transactions · saved`:"Raiffeisen Serbia"}
          </div>
        </div>
      </div>
      {transactions.length>0&&(
        <button onClick={()=>setShowClearConfirm(true)}
          style={{background:"none",border:`1px solid ${C.red}66`,color:C.red,fontSize:11,padding:"4px 10px",borderRadius:20,cursor:"pointer"}}>
          🗑️ Clear all
        </button>
      )}
    </div>

    {showClearConfirm&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.75)",zIndex:100,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div style={{background:C.card,borderRadius:16,padding:24,border:`1px solid ${C.border}`,maxWidth:320,width:"100%"}}>
        <div style={{fontSize:24,marginBottom:10,textAlign:"center"}}>🗑️</div>
        <div style={{fontSize:15,fontWeight:600,marginBottom:8,textAlign:"center"}}>Delete all data?</div>
        <div style={{fontSize:13,color:C.muted,marginBottom:20,textAlign:"center",lineHeight:1.5}}>
          This will permanently delete all {transactions.length} transactions. This cannot be undone.
        </div>
        <div style={{display:"flex",gap:10}}>
          <button onClick={()=>setShowClearConfirm(false)}
            style={{flex:1,background:C.surface,border:`1px solid ${C.border}`,color:C.text,borderRadius:10,padding:"10px",fontSize:14,cursor:"pointer"}}>
            Cancel
          </button>
          <button onClick={clearAll}
            style={{flex:1,background:C.red,border:"none",color:"#fff",borderRadius:10,padding:"10px",fontSize:14,fontWeight:600,cursor:"pointer"}}>
            Delete all
          </button>
        </div>
      </div>
    </div>}

    <div style={{background:C.surface,borderBottom:`1px solid ${C.border}`,display:"flex",padding:"0 20px",overflowX:"auto"}}>
      {TABS.map(t=>(
        <button key={t.id} onClick={()=>!t.disabled&&setTab(t.id)}
          style={{background:"none",border:"none",padding:"12px 16px",cursor:t.disabled?"default":"pointer",
            color:tab===t.id?C.accent:t.disabled?C.dimmed:C.muted,fontSize:13,fontWeight:tab===t.id?600:400,
            borderBottom:tab===t.id?`2px solid ${C.accent}`:"2px solid transparent",marginBottom:-1,transition:"color 0.2s",whiteSpace:"nowrap"}}>
          {t.label}
        </button>
      ))}
    </div>

    <div style={{maxWidth:800,margin:"0 auto",padding:"20px 16px"}}>

      {tab==="upload"&&<div style={{display:"flex",flexDirection:"column",gap:16}}>
        {transactions.length>0&&<div style={{background:C.greenSoft,border:`1px solid ${C.green}44`,borderRadius:12,padding:14,display:"flex",alignItems:"center",gap:10}}>
          <span style={{fontSize:20}}>💾</span>
          <div>
            <div style={{fontSize:13,fontWeight:600,color:C.green}}>Data saved on this device</div>
            <div style={{fontSize:12,color:C.muted,marginTop:2}}>{transactions.length} transactions · {dateRange}</div>
          </div>
        </div>}

        <div onClick={()=>!pdfLoading&&fileRef.current?.click()}
          style={{border:`2px dashed ${pdfLoading?C.accent:C.border}`,borderRadius:16,padding:"36px 24px",textAlign:"center",background:pdfLoading?C.accentSoft:C.card,cursor:pdfLoading?"default":"pointer",transition:"all 0.3s"}}>
          <input ref={fileRef} type="file" accept=".pdf,.csv,.txt" style={{display:"none"}}
            onChange={e=>{const f=e.target.files[0];if(f)handleFile(f);e.target.value="";}}/>
          <div style={{fontSize:40,marginBottom:12}}>{pdfLoading?"⏳":"📄"}</div>
          <div style={{fontSize:15,fontWeight:600,marginBottom:6}}>
            {pdfLoading?"Reading PDF...":transactions.length>0?"Add another statement":"Upload Raiffeisen statement"}
          </div>
          <div style={{fontSize:13,color:C.muted,marginBottom:12}}>PDF or CSV from raiffeisenbank.rs</div>
          <div style={{display:"flex",justifyContent:"center",gap:8}}>
            {["PDF","CSV"].map(f=><span key={f} style={{background:C.accentSoft,color:C.accent,fontSize:11,padding:"3px 10px",borderRadius:20,border:`1px solid ${C.accent}44`}}>{f}</span>)}
          </div>
        </div>

        {parseLog&&<div style={{padding:"10px 14px",borderRadius:8,
          background:parseLog.startsWith("✅")?C.greenSoft:parseLog.startsWith("🗑️")?C.redSoft:C.amberSoft,
          border:`1px solid ${parseLog.startsWith("✅")?C.green:parseLog.startsWith("🗑️")?C.red:C.amber}44`,
          fontSize:13,color:parseLog.startsWith("✅")?C.green:parseLog.startsWith("🗑️")?C.red:C.amber}}>
          {parseLog}
        </div>}

        <div style={{background:C.card,borderRadius:12,padding:16,border:`1px solid ${C.border}`}}>
          <div style={{fontSize:12,color:C.muted,marginBottom:12,textTransform:"uppercase",letterSpacing:0.5}}>How to download from Raiffeisen Serbia</div>
          {[
            {n:"1",t:"raiffeisenbank.rs → Internet bankarstvo → login"},
            {n:"2",t:"Moj račun → Izvodi i transakcije → select account"},
            {n:"3",t:"Choose period → Preuzmi izvod → PDF"},
            {n:"4",t:"Upload above — new data merges with existing (duplicates skipped)"},
          ].map(s=>(
            <div key={s.n} style={{display:"flex",gap:10,marginBottom:10,alignItems:"flex-start"}}>
              <div style={{width:22,height:22,borderRadius:"50%",background:C.accentSoft,border:`1px solid ${C.accent}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,color:C.accent,flexShrink:0,marginTop:1}}>{s.n}</div>
              <div style={{fontSize:13,color:C.text,lineHeight:1.5}}>{s.t}</div>
            </div>
          ))}
        </div>

        <div style={{background:C.card,borderRadius:12,padding:16,border:`1px solid ${C.border}`}}>
          <div style={{fontSize:12,color:C.muted,marginBottom:10,textTransform:"uppercase",letterSpacing:0.5}}>Or paste CSV manually</div>
          <textarea value={pasteText} onChange={e=>setPasteText(e.target.value)}
            placeholder={"01.06.2025;Maxi supermarket;1850;0;98150;RSD\n05.06.2025;Car Go taksi;450;0;97700;RSD"}
            style={{width:"100%",height:90,background:C.bg,border:`1px solid ${C.border}`,borderRadius:8,padding:"10px 12px",color:C.text,fontFamily:"monospace",fontSize:12,resize:"vertical",outline:"none",boxSizing:"border-box"}}/>
          <button onClick={()=>{if(pasteText.trim())processText(pasteText,false);}}
            style={{marginTop:10,background:C.accent,color:"#fff",border:"none",borderRadius:8,padding:"9px 20px",fontSize:13,fontWeight:600,cursor:"pointer"}}>
            Add →
          </button>
        </div>
      </div>}

      {tab==="overview"&&transactions.length>0&&<div style={{display:"flex",flexDirection:"column",gap:16}}>
        {dateRange&&<div style={{fontSize:12,color:C.muted,textAlign:"center"}}>📅 {dateRange}</div>}
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:12}}>
          {[
            {label:"Income",value:income,color:C.green,bg:C.greenSoft,pre:"+"},
            {label:"Expenses",value:expense,color:C.red,bg:C.redSoft,pre:"-"},
            {label:"Balance",value:balance,color:balance>=0?C.green:C.red,bg:balance>=0?C.greenSoft:C.redSoft,pre:balance>=0?"+":""},
          ].map(k=>(
            <div key={k.label} style={{background:k.bg,border:`1px solid ${k.color}33`,borderRadius:12,padding:14}}>
              <div style={{fontSize:11,color:C.muted,textTransform:"uppercase",letterSpacing:0.5,marginBottom:6}}>{k.label}</div>
              <div style={{fontSize:16,fontWeight:700,color:k.color}}>{k.pre}{fmt(Math.abs(k.value))}</div>
            </div>
          ))}
        </div>
        {catData.length>0&&<div style={{background:C.card,borderRadius:12,padding:16,border:`1px solid ${C.border}`}}>
          <div style={{fontSize:13,fontWeight:600,marginBottom:14}}>Expenses by category</div>
          <BarChart data={catData.slice(0,12)}/>
        </div>}
        <div style={{background:C.accentSoft,borderRadius:12,padding:14,border:`1px solid ${C.accent}33`,display:"flex",gap:10,alignItems:"flex-start"}}>
          <span style={{fontSize:20}}>💡</span>
          <div>
            <div style={{fontSize:13,fontWeight:600,color:C.accent,marginBottom:4}}>50/30/20 rule</div>
            <div style={{fontSize:12,color:C.muted,lineHeight:1.5}}>
              Needs: <b style={{color:C.text}}>{fmt(income*0.5)}</b> · Wants: <b style={{color:C.text}}>{fmt(income*0.3)}</b> · Savings: <b style={{color:C.green}}>{fmt(income*0.2)}</b>
            </div>
          </div>
        </div>
        <div style={{background:C.card,borderRadius:12,border:`1px solid ${C.border}`,overflow:"hidden"}}>
          <div style={{padding:"12px 16px",borderBottom:`1px solid ${C.border}`,display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
            <div style={{fontSize:13,fontWeight:600}}>Transactions ({filtered.length})</div>
            <div style={{display:"flex",gap:6}}>
              {[["all","All"],["expense","Expenses"],["income","Income"]].map(([v,l])=>(
                <button key={v} onClick={()=>setTxFilter(v)}
                  style={{background:txFilter===v?C.accent:"none",border:`1px solid ${txFilter===v?C.accent:C.border}`,color:txFilter===v?"#fff":C.muted,fontSize:11,padding:"3px 10px",borderRadius:20,cursor:"pointer"}}>{l}</button>
              ))}
            </div>
          </div>
          <div style={{maxHeight:350,overflowY:"auto"}}>
            {filtered.slice().sort((a,b)=>{
              const da=a.date.split(".").reverse().join(""), db=b.date.split(".").reverse().join("");
              return db.localeCompare(da);
            }).slice(0,150).map(t=><TxRow key={t.id} t={t}/>)}
            {filtered.length>150&&<div style={{padding:"10px",fontSize:12,color:C.muted,textAlign:"center"}}>Showing 150 of {filtered.length}</div>}
          </div>
        </div>
        <button onClick={()=>setTab("chat")}
          style={{background:`linear-gradient(135deg,${C.accent},#8B5CF6)`,color:"#fff",border:"none",borderRadius:10,padding:"12px 20px",fontSize:14,fontWeight:600,cursor:"pointer",textAlign:"center"}}>
          💬 Discuss with AI assistant →
        </button>
      </div>}

      {tab==="mortgage"&&<div style={{display:"flex",flexDirection:"column",gap:16}}>
        <div style={{background:C.card,borderRadius:12,padding:16,border:`1px solid ${C.border}`,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <div>
            <div style={{fontSize:14,fontWeight:600}}>🏦 Mortgage calculator</div>
            <div style={{fontSize:12,color:C.muted,marginTop:2}}>Settings saved automatically</div>
          </div>
          <button onClick={()=>setMortgage(m=>({...m,enabled:!m.enabled}))}
            style={{background:mortgage.enabled?C.green:C.dimmed,border:"none",borderRadius:20,padding:"6px 16px",color:"#fff",fontSize:12,fontWeight:600,cursor:"pointer"}}>
            {mortgage.enabled?"On":"Off"}
          </button>
        </div>
        {mortgage.enabled?<MortgagePanel mortgage={mortgage} setMortgage={setMortgage}/>
          :<div style={{textAlign:"center",padding:"40px 20px",color:C.muted,fontSize:14}}>Enable the calculator above</div>}
      </div>}

      {tab==="chat"&&<div style={{display:"flex",flexDirection:"column",height:"calc(100vh - 180px)"}}>
        {messages.length<=1&&<div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:16}}>
          {["Where do I spend the most?","How much can I save?","Forecast next month","Savings strategy","When will mortgage be paid off?","Is early repayment worth it?","Analyse my cash withdrawals"].map(q=>(
            <button key={q} onClick={()=>setChatInput(q)}
              style={{background:C.card,border:`1px solid ${C.border}`,color:C.muted,fontSize:12,padding:"6px 12px",borderRadius:20,cursor:"pointer"}}>{q}</button>
          ))}
        </div>}
        <div style={{flex:1,overflowY:"auto",paddingRight:4}}>
          {messages.map((m,i)=><Message key={i} msg={m}/>)}
          {loading&&<div style={{display:"flex",alignItems:"center",gap:8,color:C.muted,fontSize:13,marginBottom:12}}>
            <div style={{width:28,height:28,borderRadius:"50%",background:C.accentSoft,border:`1.5px solid ${C.accent}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:13}}>💡</div>
            <div style={{display:"flex",gap:4}}>{[0,1,2].map(i=><div key={i} style={{width:6,height:6,borderRadius:"50%",background:C.accent,animation:`pulse 1.2s ease-in-out ${i*0.2}s infinite`}}/>)}</div>
          </div>}
          <div ref={chatEndRef}/>
        </div>
        <div style={{display:"flex",gap:10,marginTop:12,padding:"12px 0"}}>
          <input value={chatInput} onChange={e=>setChatInput(e.target.value)}
            onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage();}}}
            placeholder="Ask about your budget or mortgage..."
            style={{flex:1,background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:"11px 16px",color:C.text,fontSize:14,outline:"none"}}/>
          <button onClick={sendMessage} disabled={loading||!chatInput.trim()}
            style={{background:loading||!chatInput.trim()?C.dimmed:C.accent,color:"#fff",border:"none",borderRadius:12,width:44,height:44,fontSize:18,cursor:loading?"default":"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>→</button>
        </div>
      </div>}
    </div>
    <style>{`
      @keyframes pulse{0%,100%{opacity:0.3;transform:scale(0.8);}50%{opacity:1;transform:scale(1);}}
      *{box-sizing:border-box;}
      ::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:${C.border};border-radius:2px;}
      textarea:focus,input:focus{border-color:${C.accent}!important;}
      button:hover:not(:disabled){opacity:0.88;}
      select{appearance:none;}
    `}</style>
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
  </script>
</body>
</html>
